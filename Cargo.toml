[package]
name = "nevis"
version = "0.2.0"
edition = "2024"
description = "A fast, minimal text and Markdown editor (GTK4 + GtkSourceView)"
license = "MIT"
# Two programs: `nevis` (the quick launcher you run) and `nevis-app` (the GTK app).
autobins = false

[[bin]]
name = "nevis"
path = "src/launcher.rs"

[[bin]]
name = "nevis-app"
path = "src/main.rs"

[dependencies]
gio = "0.22"
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
sourceview = { package = "sourceview5", version = "0.11" }
cairo-rs = { version = "0.22", features = ["svg"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["simd", "html"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
